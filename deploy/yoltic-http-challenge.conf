# Initial stage: validate domain ownership without publishing the application.
server {
    listen 80;
    listen [::]:80;
    server_name yoltic.ir www.yoltic.ir;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/yoltick/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
