# Activate only after certificate issuance and owner confirmation of publication.
server {
    listen 80;
    listen [::]:80;
    server_name yoltic.ir www.yoltic.ir;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/yoltick/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://yoltic.ir$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yoltic.ir;
    ssl_certificate /etc/letsencrypt/live/yoltic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoltic.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 301 https://yoltic.ir$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yoltic.ir;
    ssl_certificate /etc/letsencrypt/live/yoltic.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoltic.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host yoltic.ir;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host yoltic.ir;
        proxy_set_header X-Forwarded-Host yoltic.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
